name: CI — Build & Quality Checks

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  security:
    name: Verify Package Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Audit dependencies
        run: |
          if ! pnpm audit --audit-level high; then
            echo "::warning::Security vulnerabilities found in dependencies. Please review and update affected packages."
            exit 0
          fi
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Build
        run: pnpm build

