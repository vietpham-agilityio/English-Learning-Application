name: CI — Build & Quality Checks

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  security:
      name: Verify Package Security
      runs-on: ubuntu-latest
      continue-on-error: true

      steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Build
        run: pnpm build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: ./.github/actions/setup-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/english-learning-application
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max

  deploy-be:
    name: Deploy Backend — Railway
    runs-on: ubuntu-latest
    needs: [docker]
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Doppler and Railway environment
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "doppler_token=${{ secrets.DOPPLER_TOKEN_BE_PRODUCTION }}" >> $GITHUB_OUTPUT
            echo "railway_environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "doppler_token=${{ secrets.DOPPLER_TOKEN_BE_STAGING }}" >> $GITHUB_OUTPUT
            echo "railway_environment=staging" >> $GITHUB_OUTPUT
          else
            echo "doppler_token=${{ secrets.DOPPLER_TOKEN_BE_DEV }}" >> $GITHUB_OUTPUT
            echo "railway_environment=develop" >> $GITHUB_OUTPUT
          fi

      - name: Setup Doppler CLI
        uses: ./.github/actions/setup-doppler
        with:
          token: ${{ steps.resolve.outputs.doppler_token }}

      - name: Verify Doppler authentication
        run: doppler me

      - name: Setup Railway CLI
        uses: ./.github/actions/setup-railway

      - name: Validate required environment variables
        run: |
          MISSING=()

          [[ -z "$RAILWAY_PROJECT_ID" ]] && MISSING+=("RAILWAY_PROJECT_ID (secret)")
          [[ -z "$RAILWAY_TOKEN" ]] && MISSING+=("RAILWAY_TOKEN (secret)")
          [[ -z "$RAILWAY_SERVICE" ]] && MISSING+=("RAILWAY_SERVICE (variable)")

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required environment variables:"
            for VAR in "${MISSING[@]}"; do
              echo "::error::  - $VAR"
            done
            exit 1
          fi

        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Trigger Railway re-deploying
        run: doppler run -- railway redeploy --service ${{ vars.RAILWAY_SERVICE }} --environment ${{ steps.resolve.outputs.railway_environment }} --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
